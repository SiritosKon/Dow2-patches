name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  dlls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 make
      - run: make
      - run: sha256sum build/*.dll | tee build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dow2-fixes-dlls
          path: build/*
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
