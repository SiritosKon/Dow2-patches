[LobbyStats]
; 1 = Relic rating and stats in the lobby (names and hover tooltips), 0 = off (the host filter still works)
Stats=1
; 1 = rating after the name in the lobby, 0 = only in the hover tooltip
ShowRatingInName=1

[Guard]
; Host-only lobby filter, normally set with the two lists under "Starting resources" in Game Setup.
; Works only when YOU host. Players who join don't need the DLL.
; 0 = off (default)
Enabled=0
; 1 = test mode: the bot only writes "[Bot test] X would be kicked: ..." in lobby chat, nobody is kicked (0 = real kicks)
DryRun=0
; rules, 0 = rule off
MinRating=0
; e.g. 1800 for a "low/mid" lobby: keeps strong players out
MaxRating=0
; win rate in percent
MinWinRate=0
MaxWinRate=0
MinGames=0
; hours are skipped for players with a private Steam profile
MinHours=0
; 1 = also kick players the stats server knows nothing about (brand-new accounts).
; Network errors never count as "unknown": if the server is down, nobody is kicked.
KickUnknown=0
; seconds between the chat message and the kick
KickDelaySeconds=5

[UI]
; 1 = the two filter lists under "Starting resources" (shown only to the host), 0 = off (chat command !filter still works)
FilterLists=1
; distance between the lists, in the Game Setup panel's pixels
FilterListsStep=52
; 1 = the lists open upwards (they sit at the bottom of the panel)
FilterListsOpenUp=1

[Chat]
; channel number of the General chat for "X was kicked" notices (the kicked player can't see the match chat anymore).
; 0 = not known yet: it is learned automatically the first time you write anything in the General tab.
GeneralChannel=0
